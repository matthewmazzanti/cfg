[nixstore-tiny]
description=Random tiny file I/O (<4K)
directory=/mnt/nix
rw=randrw
bsrange=512-4K
size=5.3G
numjobs=12
filesize=1K-4K
file_service_type=random
runtime=180
iodepth=8
time_based
group_reporting
new_group
stonewall

[nixstore-small]
description=Random small file I/O, emulating nix store workload
directory=/mnt/nix            # <-- Change to your nix store path
rw=randrw
bsrange=1K-16K                # Match 0-90th percentile (you can adjust)
size=5.3G                       # Total data written per job
numjobs=12                     # Simulate parallel work (adjust for your CPU)
filesize=4K-64K               # Create many small files (median to 95th percentile)
file_service_type=random      # Access files randomly
runtime=180
iodepth=8
time_based
group_reporting
new_group
stonewall

[nixstore-large]
description=Random I/O for larger files (1%+)
directory=/mnt/nix            # <-- Change as above
rw=randrw
bsrange=64K-256K              # Match 95th-99th percentiles
size=32G
numjobs=2
filesize=128K-2M              # Simulate the few big files
file_service_type=random
runtime=180
iodepth=4
time_based
group_reporting
new_group
stonewall
