[home-small]
description=Dev-like random small file I/O for home directory
directory=/mnt/home           # <-- Change to your actual home mountpoint
rw=randrw
bsrange=2K-32K                # Typical for editing, code, configs
size=4G
numjobs=6                     # Simulate several interactive tasks
filesize=8K-128K              # Range for most home/dev files
file_service_type=random
time_based
runtime=180
iodepth=8
wait_for_previous

[home-medium]
description=Random I/O for project files or compiles
directory=/mnt/home           # <-- As above
rw=randrw
bsrange=32K-128K              # Medium code/data I/O
size=2G
numjobs=2
filesize=128K-2M              # Larger project data or cache files
file_service_type=random
time_based
runtime=180
iodepth=4
wait_for_previous

[home-large]
description=Sequential read/write for large files (downloads, archiving)
directory=/mnt/home
rw=rw                         # Sequential read+write
bs=1M
size=1G
numjobs=1
filesize=100M-1G
file_service_type=sequential
time_based
runtime=120
iodepth=2
wait_for_previous
