[nixstore-small]
description=Random small file I/O, emulating nix store workload
directory=/mnt/nix            # <-- Change to your nix store path
rw=randrw
bsrange=1K-16K                # Match 0-90th percentile (you can adjust)
size=4G                       # Total data written per job
numjobs=8                     # Simulate parallel work (adjust for your CPU)
filesize=4K-64K               # Create many small files (median to 95th percentile)
file_service_type=rand        # Access files randomly
time_based
runtime=180
iodepth=8
group_reporting

[nixstore-large]
description=Random I/O for larger files (1%+)
directory=/mnt/nix            # <-- Change as above
rw=randrw
bsrange=64K-256K              # Match 95th-99th percentiles
size=2G
numjobs=2
filesize=128K-2M              # Simulate the few big files
file_service_type=rand
time_based
runtime=180
iodepth=4
group_reporting

[home-small]
description=Dev-like random small file I/O for home directory
directory=/mnt/home           # <-- Change to your actual home mountpoint
rw=randrw
bsrange=2K-32K                # Typical for editing, code, configs
size=4G
numjobs=6                     # Simulate several interactive tasks
filesize=8K-128K              # Range for most home/dev files
file_service_type=rand
time_based
runtime=180
iodepth=8
group_reporting

[home-medium]
description=Random I/O for project files or compiles
directory=/mnt/home           # <-- As above
rw=randrw
bsrange=32K-128K              # Medium code/data I/O
size=2G
numjobs=2
filesize=128K-2M              # Larger project data or cache files
file_service_type=rand
time_based
runtime=180
iodepth=4
group_reporting

[home-large]
description=Sequential read/write for large files (downloads, archiving)
directory=/mnt/home
rw=rw                         # Sequential read+write
bs=1M
size=1G
numjobs=1
filesize=100M-1G
file_service_type=sequential
time_based
runtime=120
iodepth=2
group_reporting
