events {}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr debug;

    # TLS config (Mozilla modern)
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;

    # Security / XSS Mitigation Headers
    add_header X-Content-Type-Options "nosniff" always;
    # Permissions policy. May cause issues with some clients
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name jellyfin.iot;

        return 301 https://$host$request_uri;
    }

    server {
        # Nginx versions 1.25+
        listen 443 ssl;
        server_name jellyfin.iot;

        http2 on;
        ssl_certificate     /etc/nginx/ssl/jellyfin.iot.crt;
        ssl_certificate_key /etc/nginx/ssl/jellyfin.iot.key;

        # The default `client_max_body_size` is 1M, this might not be enough
        # for some posters, etc.
        client_max_body_size 20M;

        location / {
            # Proxy main Jellyfin traffic
            proxy_pass http://127.0.0.1:8096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # Disable buffering when the nginx proxy gets very resource heavy upon streaming
            proxy_buffering off;
        }

        location /socket {
            # Proxy Jellyfin Websockets traffic
            proxy_pass http://127.0.0.1:8096;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
