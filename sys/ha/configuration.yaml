http:
  server_host: 127.0.0.1
  server_port: 8123
  use_x_forwarded_for: true
  trusted_proxies: 127.0.0.1

logger:
  default: info

sun:
# Enable Apple TV
zeroconf:
dhcp:
# Enable mobile application
mobile_app:
# Enable state history
history:

resources:
  - url: "/local/slider-entity-row/slider-entity-row.js"
    type: js

script:
  entities_toggle:
    alias: Toggle Entities
    description: Toggle a group of entities
    mode: parallel
    fields:
      entity_id:
        description: List of entity IDs
        example: '["light.living_room", "switch.fan"]'
        required: true
        selector:
          entity:
            multiple: true
    sequence:
      - variables:
          any_on: "{{ 'on' in entity_id | map('states') }}"
      - action: "{{ 'homeassistant.turn_off' if any_on else 'homeassistant.turn_on' }}"
        target:
          entity_id: "{{ entity_id }}"

  multicast_switch_set:
    alias: Multicast Switch Set
    description: Set a state for a group of Z-Wave switches via multicast (skips ones already matching)
    mode: parallel
    fields:
      entity_id:
        description: List of Z-Wave switch entity IDs
        required: true
        selector:
          entity:
            multiple: true
            filter:
              domain: switch
              integration: zwave
      value:
        description: Desired state
        required: true
        selector:
          boolean:
    sequence:
      - variables:
          # desired HA state string from boolean
          desired: "{{ 'on' if value else 'off' }}"
          targets: >-
            {{ expand(entity_id)
               | rejectattr('state', 'equalto', desired)
               | map(attribute='entity_id') | list }}
      - service: system_log.write
        data:
          level: debug
          message: >-
            multicast_switch_set → value={{ value }},
            desired="{{ desired }}",
            targets={{ targets }}
      - choose:
          # multiple targets → multicast
          - conditions: "{{ targets | length > 1 }}"
            sequence:
              - service: zwave_js.multicast_set_value
                target:
                  entity_id: "{{ targets }}"
                data:
                  command_class: "37"
                  property: targetValue
                  value: "{{ value }}"
          # single target → direct switch service
          - conditions: "{{ targets | length == 1 }}"
            sequence:
              - service: "switch.turn_{{ 'on' if value else 'off' }}"
                target:
                  entity_id: "{{ targets[0] }}"

  multicast_light_set:
    alias: Multicast Light Set
    description: Turn on or dim a group of ZWave lights via multicast
    mode: parallel
    fields:
      entity_id:
        description: List of ZWave entity IDs
        required: true
        selector:
          entity:
            multiple: true
            filter:
              domain: light
              integration: zwave
      value:
        description: Brightness to set for light group (0–99)
        required: true
        selector:
          number:
            min: 0
            max: 99
            step: 1
    sequence:
      - variables:
          # Convert Z-Wave 0–99 to HA brightness 0–255
          desired_byte: "{{ (255 * (value | int) / 99) | round | int }}"
          targets: >-
            {{ expand(entity_id)
               | rejectattr('attributes.brightness', 'equalto', desired_byte)
               | map(attribute='entity_id') | list }}
      - service: system_log.write
        data:
          level: debug
          message: >-
            multicast_light_set → value={{ value }},
            brightness={{ brightness }},
            targets={{ targets }}
      - choose:
          # multiple targets → multicast
          - conditions: "{{ targets | length > 1 }}"
            sequence:
              - service: zwave_js.multicast_set_value
                target:
                  entity_id: "{{ targets }}"
                data:
                  command_class: "38"
                  property: targetValue
                  value: "{{ value }}"
          # single target → direct light service with desired_byte
          - conditions: "{{ targets | length == 1 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: "{{ targets[0] }}"
                data:
                  brightness: "{{ desired_byte }}"

  multicast_switch_toggle:
    alias: Multicast Switch Toggle
    description: Toggle a group of zwave switches via multicast
    mode: parallel
    fields:
      entity_id:
        description: List of ZWave entity IDs
        required: True
        selector:
          entity:
            multiple: true
            filter:
              domain: switch
              integration: zwave
    sequence:
      - action: script.multicast_switch_set
        target:
          entity_id: "{{ entity_id }}"
        data:
          value: "{{ 'on' not in entity_id | map('states') }}"

  multicast_light_toggle:
    alias: Multicast Light Toggle
    description: Toggle a group of zwave lights via multicast
    mode: parallel
    fields:
      entity_id:
        description: List of ZWave entity IDs
        required: True
        selector:
          entity:
            multiple: true
            filter:
              domain: light
              integration: zwave
    sequence:
      - action: script.multicast_light_set
        target:
          entity_id: "{{ entity_id }}"
        data:
          value: "{{ 99 if 'off' in entity_id | map('states') else 0 }}"

  living_room_low_lights_off:
    alias: Living Room Lights Off
    description: Turn off small side lamps in living room
    mode: queued
    sequence:
      - action: script.multicast_switch_set
        target:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
        data:
          value: false

  living_room_low_lights_on:
    alias: Living Room Lights On
    description: Turn on small side lamps in living room
    mode: queued
    sequence:
      - action: script.multicast_switch_set
        target:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
        data:
          value: true

  living_room_low_lights_toggle:
    alias: Living Room Lights Toggle
    description: Toggle small side lamps in living room
    mode: queued
    sequence:
      - action: script.multicast_switch_toggle
        target:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp

  kitchen_low_lights_off:
    alias: Kitchen Lights Off
    description: Turn off lower lights in kitchen
    mode: queued
    sequence:
      - action: homeassistant.turn_off
        target:
          entity_id:
            - switch.under_cabinet_lights
            - light.island_lights

  kitchen_low_lights_on:
    alias: Kitchen Lights On
    description: Turn on lower lights in kitchen
    mode: queued
    sequence:
      - action: homeassistant.turn_on
        target:
          entity_id:
            - switch.under_cabinet_lights
            - light.island_lights

  kitchen_low_lights_toggle:
    alias: Kitchen Lights Toggle
    description: Toggle lower level lights in kitchen
    mode: queued
    sequence:
      - action: script.entities_toggle
        target:
          entity_id:
            - switch.under_cabinet_lights
            - light.island_lights

  kitchen_ceiling_lights_on:
    alias: Kitchen Ceiling Lights On
    description: Turn on all ceiling lights in the kitchen
    mode: queued
    sequence:
      - action: script.multicast_light_set
        target:
          entity_id:
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights
        data:
          value: 99

  kitchen_ceiling_lights_off:
    alias: Kitchen Ceiling Lights Off
    description: Turn off all ceiling lights in the kitchen
    mode: queued
    sequence:
      - action: script.multicast_light_set
        target:
          entity_id:
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights
        data:
          value: 0

  kitchen_ceiling_lights_toggle:
    alias: Kitchen Ceiling Lights toggle
    description: Toggle all ceiling lights in the kitchen
    mode: queued
    sequence:
      - action: script.multicast_light_toggle
        target:
          entity_id:
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights

  ceiling_lights_off:
    alias: Ceiling Lights Off
    description: Turn Off First Floor Ceiling Lights
    mode: queued
    sequence:
      - action: script.multicast_light_set
        target:
          entity_id:
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights
        data:
          value: 0

  ceiling_lights_on:
    alias: Ceiling Lights On
    description: Turn On First Floor Ceiling Lights
    mode: queued
    sequence:
      - action: script.multicast_light_set
        target:
          entity_id:
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights
        data:
          value: 99

  ceiling_lights_toggle:
    alias: Ceiling Lights Toggle
    description: Toggle First Floor Ceiling Lights
    mode: queued
    sequence:
      - action: script.multicast_light_toggle
        target:
          entity_id:
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights

  first_floor_low_lights_on:
    alias: First Floor Low Lights On
    description: Turn low lights on
    mode: queued
    sequence:
      - action: script.multicast_switch_set
        target:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
            - switch.under_cabinet_lights
        data:
          value: true

      - action: script.multicast_light_set
        target:
          entity_id:
            - light.island_lights
        data:
          value: 99


  first_floor_all_on:
    alias: First Floor All On
    description: Turn all of the first floor lights on
    mode: queued
    sequence:
      - action: script.multicast_switch_set
        target:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
            - switch.under_cabinet_lights
        data:
          value: true

      - action: script.multicast_light_set
        target:
          entity_id:
            - light.island_lights
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights
        data:
          value: 99

  first_floor_all_off:
    alias: First Floor Evening Off
    description: Turn all of the first floor off in the evening
    mode: queued
    sequence:
      - action: script.multicast_switch_set
        target:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
        data:
          value: false

      - action: script.multicast_light_set
        target:
          entity_id:
            - light.island_lights
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights
        data:
          value: 0


automation:
  - id: set_day_temp
    alias: Set Day Temp
    trigger:
      - platform: time
        at: "08:00"
    action:
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: 75
          target_temp_low: 70

  - id: set_transition_temp
    alias: Set Transition Temp
    trigger:
      - platform: time
        at:
          - "07:00"
          - "22:00"
    action:
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: 74
          target_temp_low: 69

  - id: set_night_temp
    alias: Set Day Temp
    trigger:
      - platform: time
        at: "23:00"
    action:
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: 73
          target_temp_low: 68

  - id: turn_off_master_bedroom_apple_tv
    alias: Turn off Apple TVs
    trigger:
      - platform: time
        at:
          - "00:00"
          - "01:00"
          - "02:00"
          - "03:00"
          - "04:00"
          - "05:00"
    action:
      - action: media_player.turn_off
        target:
          entity_id:
            - media_player.master_bedroom

  - id: turn_off_living_room_apple_tv
    alias: Turn off Apple TVs
    trigger:
      - platform: time
        at:
          - "00:00"
          - "01:00"
          - "02:00"
          - "03:00"
          - "04:00"
          - "05:00"
    action:
      - action: media_player.turn_off
        target:
          entity_id:
            - media_player.living_room

  - id: turn_on_espresso_machine
    alias: Turn on Espresso Machine
    trigger:
      - platform: time
        at: "06:00"
    action:
      - action: switch.turn_on
        target:
          entity_id: switch.espresso_machine

  - id: turn_off_espresso_machine
    alias: Turn off Espresso Machine
    trigger:
      - platform: time
        at:
          - "19:00"
          - "00:00"
    action:
      - action: switch.turn_off
        target:
          entity_id: switch.espresso_machine

  - id: turn_on_mbr_lamp_at_sunset
    alias: "MBR Lamp: On at sunset"
    description: "Turn on the master bedroom lamp at sunset"
    mode: single
    trigger:
      - platform: sun
        event: sunset
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.mbr_lamp

  # ---------------- Pico Remote Template ----------------
  # Copy/paste and replace the placeholders (id, alias, area/device names, etc.)
  #
  # Buttons (Lutron Caseta):
  #   2 = Top Button
  #   3 = Middle Button
  #   4 = Bottom Button
  #   5 = Up Arrow
  #   6 = Down Arrow
  #
  # Usage:
  #   - Change `id` and `alias` to something unique.
  #   - Set `area_name` and `device_name` to match your Pico remote.
  #   - Replace `system_log.write` actions with your desired service calls.
  # - id: pico_<area>_<device>      # <-- Unique identifier
  #   alias: <Area> Pico <Device> Handler
  #   trigger:
  #     - platform: event
  #       event_type: lutron_caseta_button_event
  #       event_data:
  #         area_name: <Area Name>        # e.g. "Living Room"
  #         device_name: <Device Name>    # e.g. "Living Room 1"
  #         action: press
  #   action:
  #     - variables:
  #         button: "{{ trigger.event.data.button_number }}"
  #         device: "{{ trigger.event.data.device_name }}"
  #         buttons: { top: 2, middle: 3, bottom: 4, up: 5, down: 6 }
  #     - choose:
  #         - conditions: "{{ button == buttons.top }}"
  #           sequence:
  #             - action: system_log.write
  #               data:
  #                 message: "Pico {{ device }} Top Button Pressed!"
  #                 level: debug

  - id: pico_living_room_2
    alias: Living Room Pico 2 Handler
    trigger:
      - platform: event
        event_type: lutron_caseta_button_event
        event_data:
          area_name: Living Room
          device_name: Living Room 2
          action: press
    action:
      - variables:
          button: "{{trigger.event.data.button_number}}"
          device: "{{trigger.event.data.device_name}}"
          buttons: { top: 2, middle: 3, bottom: 4, up: 5, down: 6 }
      - choose:
          - conditions: "{{button == buttons.top}}"
            sequence:
              - action: script.first_floor_low_lights_on
          - conditions: "{{button == buttons.bottom}}"
            sequence:
              - action: script.first_floor_all_off

  - id: pico_master_bedroom
    alias: Master Bedroom Pico Handler
    trigger:
      - platform: event
        event_type: lutron_caseta_button_event
        event_data:
          area_name: Master Bedroom
          device_name: Master Bedroom
          action: press
    action:
      - variables:
          button: "{{trigger.event.data.button_number}}"
          device: "{{trigger.event.data.device_name}}"
          buttons: { top: 2, middle: 3, bottom: 4, up: 5, down: 6 }
      - choose:
          - conditions: "{{button == buttons.bottom}}" # Bottom Button
            sequence:
              - action: switch.toggle
                data:
                  entity_id: switch.mbr_lamp

  - id: living_room_lights_scenes
    alias: Living Room Lights Scenes
    trigger:
      - platform: event
        event_type: zwave_js_value_notification
        event_data:
          command_class_name: Central Scene
          device_id: a5c1c236b6340ae8db83857c10e1bd8e
    action:
      - variables:
          direction: "{{'up' if trigger.event.data.property_key == '001' else 'down'}}"
          count: "{{trigger.event.data.value_raw - 1}}"

      - choose:
          - conditions: "{{direction == 'up' and count == 2}}"
            sequence:
              - action: script.first_floor_low_lights_on

          - conditions: "{{direction == 'up' and count == 3}}"
            sequence:
              - action: script.first_floor_all_on

          - conditions: "{{direction == 'down' and count == 2}}"
            sequence:
              - action: script.first_floor_all_off

  - id: sink_lights_scenes
    alias: Sink Lights Scenes
    trigger:
      - platform: event
        event_type: zwave_js_value_notification
        event_data:
          command_class_name: Central Scene
          device_id: 28b76d6993826e7dd89939ab3fccb403
    action:
      - variables:
          direction: "{{'up' if trigger.event.data.property_key == '001' else 'down'}}"
          count: "{{trigger.event.data.value_raw - 1}}"

      - choose:
          - conditions: "{{direction == 'up' and count == 2}}"
            sequence:
              - action: script.kitchen_ceiling_lights_on

          - conditions: "{{direction == 'down' and count == 2}}"
            sequence:
              - action: script.kitchen_ceiling_lights_off

  - id: under_cabinet_lights_scenes
    alias: Under Cabinet Lights Scenes
    trigger:
      - platform: event
        event_type: zwave_js_value_notification
        event_data:
          command_class_name: Central Scene
          device_id: bd1c6a735198db9c6254448325a0bfc6
    action:
      - variables:
          direction: "{{'up' if trigger.event.data.property_key == '001' else 'down'}}"
          count: "{{trigger.event.data.value_raw - 1}}"

      - choose:
          - conditions: "{{direction == 'up' and count == 2}}"
            sequence:
              - action: script.kitchen_low_lights_on

          - conditions: "{{direction == 'down' and count == 2}}"
            sequence:
              - action: script.kitchen_low_lights_off

  - id: island_lights_scenes
    alias: Under Cabinet Lights Scenes
    trigger:
      - platform: event
        event_type: zwave_js_value_notification
        event_data:
          command_class_name: Central Scene
          device_id: 5c4b7b4db1d411ee1e5bac8ec7f1a091
    action:
      - variables:
          direction: "{{'up' if trigger.event.data.property_key == '001' else 'down'}}"
          count: "{{trigger.event.data.value_raw - 1}}"

      - choose:
          - conditions: "{{direction == 'up' and count == 2}}"
            sequence:
              - action: script.kitchen_ceiling_lights_on

          - conditions: "{{direction == 'down' and count == 2}}"
            sequence:
              - action: script.kitchen_ceiling_lights_off
