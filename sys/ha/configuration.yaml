  - id: blinds_close_at_sunset
    alias: "Blinds: Close at sunset"
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
    action:
      - service: cover.set_cover_tilt_position
        target:
          entity_id:
            - cover.living_room_tv_left
            - cover.living_room_fire_left
            - cover.living_room_fire_right
        data:
          tilt_position: 0
      - service: cover.close_cover
        target:
          entity_id:
            - cover.kitchen_curtain

  - id: blinds_close_back_sun_glare
    alias: "Blinds: Close kitchen curtains on back-window glare"
    mode: single
    # back_sun_elevation is the profile angle (up from horizon) for the back
    # window. The (0, 35) band = low sun roughly facing the glass = glare.
    # The lower bound of 0 guards against firing when the sensor goes negative
    # (sun below horizon / bad data).
    triggers:
      - trigger: numeric_state
        entity_id: sensor.back_sun_elevation
        above: 0
        below: 35
    action:
      - service: cover.close_cover
        target:
          entity_id:
            - cover.kitchen_curtain
