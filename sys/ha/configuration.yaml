http:
  server_port: 8123
  use_x_forwarded_for: true
  trusted_proxies: 127.0.0.1

logger:
  # default: info
  logs:
    homeassistant.components.automation: info
    homeassistant.components.script: info
    homeassistant.components.system_log: debug
    custom_components.multicast_exec: debug
    custom_components.switchbot: debug

sun:
# Enable Apple TV
zeroconf:
dhcp:
# Enable mobile application
mobile_app:
# Enable state history
history:
multicast_exec:

template:
  - sensor:
      # ========= FRONT =========
      - name: "Front Sun Offset"
        unique_id: front_sun_offset
        unit_of_measurement: "°"
        state: >
          {% from 'macros.jinja' import relative_sun_offset %}
          {% set win_az = 95.0 %}
          {% set sun_az = state_attr('sun.sun', 'azimuth') | float %}
          {{ relative_sun_offset(sun_az, win_az) | round(2) }}

      - name: "Front Sun Elevation"
        unique_id: front_sun_elevation
        unit_of_measurement: "°"
        state: >
          {% from 'macros.jinja' import relative_sun_elevation %}
          {% set sun_el = state_attr('sun.sun', 'elevation') | float %}
          {% set off_h  = states('sensor.front_sun_offset') | float %}
          {{ relative_sun_elevation(sun_el, off_h) | round(2) }}

      - name: "Front Sun Tilt"
        unique_id: front_sun_tilt
        unit_of_measurement: "%"
        state: >
          {% from 'macros.jinja' import elevation_to_tilt %}
          {% set win_el = states('sensor.front_sun_elevation') | float %}
          {{ elevation_to_tilt(win_el) | round(0) }}

      # ========= SIDE =========
      - name: "Side Sun Offset"
        unique_id: side_sun_offset
        unit_of_measurement: "°"
        state: >
          {% from 'macros.jinja' import relative_sun_offset %}
          {% set win_az = 185.0 %}
          {% set sun_az = state_attr('sun.sun', 'azimuth') | float %}
          {{ relative_sun_offset(sun_az, win_az) | round(2) }}

      - name: "Side Sun Elevation"
        unique_id: side_sun_elevation
        unit_of_measurement: "°"
        state: >
          {% from 'macros.jinja' import relative_sun_elevation %}
          {% set sun_el = state_attr('sun.sun', 'elevation') | float %}
          {% set off_h  = states('sensor.side_sun_offset') | float %}
          {{ relative_sun_elevation(sun_el, off_h) | round(2) }}

      - name: "Side Sun Tilt"
        unique_id: side_sun_tilt
        unit_of_measurement: "%"
        state: >
          {% from 'macros.jinja' import elevation_to_tilt %}
          {% set win_el = states('sensor.side_sun_elevation') | float %}
          {{ elevation_to_tilt(win_el) | round(0) }}

      # ========= BACK =========
      - name: "Back Sun Offset"
        unique_id: back_sun_offset
        unit_of_measurement: "°"
        state: >
          {% from 'macros.jinja' import relative_sun_offset %}
          {% set win_az = 275.0 %}
          {% set sun_az = state_attr('sun.sun', 'azimuth') | float %}
          {{ relative_sun_offset(sun_az, win_az) | round(2) }}

      - name: "Back Sun Elevation"
        unique_id: back_sun_elevation
        unit_of_measurement: "°"
        state: >
          {% from 'macros.jinja' import relative_sun_elevation %}
          {% set sun_el = state_attr('sun.sun', 'elevation') | float %}
          {% set off_h  = states('sensor.back_sun_offset') | float %}
          {{ relative_sun_elevation(sun_el, off_h) | round(2) }}

      - name: "Back Sun Tilt"
        unique_id: back_sun_tilt
        unit_of_measurement: "%"
        state: >
          {% from 'macros.jinja' import elevation_to_tilt %}
          {% set win_el = states('sensor.back_sun_elevation') | float %}
          {{ elevation_to_tilt(win_el) | round(0) }}

script:
  first_floor_low_lights_on:
    alias: First Floor Low Lights On
    description: Turn Low Lights On
    mode: queued
    sequence:
      - action: multicast_exec.set
        data:
          target_state: true
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
            - switch.under_cabinet_lights
            - light.island_lights
      - action: multicast_exec.set
        data:
          target_state: false
          entity_id:
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights

  first_floor_low_lights_toggle:
    alias: First Floor Low Lights Toggle
    description: Toggle Low Lights
    mode: queued
    sequence:
      - action: multicast_exec.toggle
        data:
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
            - light.island_lights
      - action: multicast_exec.set
        data:
          target_state: false
          entity_id:
            - light.living_room_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights


  first_floor_all_on:
    alias: First Floor All On
    description: Turn all of the first floor lights on
    mode: queued
    sequence:
      - action: multicast_exec.set
        data:
          target_state: true
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
            - light.living_room_lights
            - switch.under_cabinet_lights
            - light.island_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights

  first_floor_all_off:
    alias: First Floor All Off
    description: Turn all of the first floor off in the evening
    mode: queued
    sequence:
      - action: multicast_exec.set
        data:
          target_state: false
          entity_id:
            - switch.living_room_corner_lamp
            - switch.living_room_bookshelf_lamp
            - light.living_room_lights
            - light.island_lights
            - light.sink_lights_2
            - light.kitchen_lights
            - light.dining_table_lights

  blinds_reset_ideal:
    alias: "Blinds: Reset to current ideal tilt"
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ has_value('sensor.side_sun_tilt') }}"
            sequence:
              - service: cover.set_cover_tilt_position
                data:
                  entity_id:
                    - cover.living_room_fire_left
                    - cover.living_room_fire_right
                  tilt_position: "{{ states('sensor.side_sun_tilt') | int }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ has_value('sensor.front_sun_tilt') }}"
            sequence:
              - service: cover.set_cover_tilt_position
                data:
                  entity_id:
                    - cover.living_room_tv_left
                  tilt_position: "{{ states('sensor.front_sun_tilt') | int }}"

automation:
  - id: set_day_temp
    alias: Set Day Temp
    triggers:
      - trigger: time
        at: "08:00"
    action:
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: 75
          target_temp_low: 70

  - id: set_transition_temp
    alias: Set Transition Temp
    triggers:
      - trigger: time
        at:
          - "07:00"
          - "22:00"
    action:
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: 74
          target_temp_low: 69

  - id: set_night_temp
    alias: Set Day Temp
    triggers:
      - trigger: time
        at: "23:00"
    action:
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: 73
          target_temp_low: 68

  - id: turn_off_master_bedroom_apple_tv
    alias: Turn off Apple TVs
    triggers:
      - trigger: time
        at:
          - "00:00"
          - "01:00"
          - "02:00"
          - "03:00"
          - "04:00"
          - "05:00"
    action:
      - action: media_player.turn_off
        target:
          entity_id:
            - media_player.master_bedroom

  - id: turn_off_living_room_apple_tv
    alias: Turn off Apple TVs
    triggers:
      - trigger: time
        at:
          - "00:00"
          - "01:00"
          - "02:00"
          - "03:00"
          - "04:00"
          - "05:00"
    action:
      - action: media_player.turn_off
        target:
          entity_id:
            - media_player.living_room

  - id: turn_on_espresso_machine
    alias: Turn on Espresso Machine
    triggers:
      - trigger: time
        at: "06:00"
    action:
      - action: switch.turn_on
        target:
          entity_id: switch.espresso_machine

  - id: turn_off_espresso_machine
    alias: Turn off Espresso Machine
    triggers:
      - trigger: time
        at:
          - "19:00"
          - "00:00"
    action:
      - action: switch.turn_off
        target:
          entity_id: switch.espresso_machine

  - id: turn_on_mbr_lamp_at_sunset
    alias: "MBR Lamp: On at sunset"
    description: "Turn on the master bedroom lamp at sunset"
    mode: single
    triggers:
      - trigger: sun
        event: sunset
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.mbr_lamp

  - id: pico_living_room_1
    alias: Living Room Pico 1 Handler
    triggers:
      - trigger: event
        event_type: lutron_caseta_button_event
        event_data:
          area_name: Living Room
          device_name: Living Room 1
          action: press
    action:
      - variables:
          button: "{{trigger.event.data.button_number}}"
          device: "{{trigger.event.data.device_name}}"
          buttons: { top: 2, middle: 3, bottom: 4, up: 5, down: 6 }
      - choose:
          - conditions: "{{button == buttons.bottom}}"
            sequence:
              - action: switch.toggle
                entity_id: switch.living_room_bookshelf_lamp
              - action: multicast_exec.set
                data:
                  target_state: false
                  entity_id:
                    - switch.living_room_corner_lamp
                    - light.living_room_lights
                    - light.island_lights
                    - light.sink_lights_2
                    - light.kitchen_lights
                    - light.dining_table_lights

  - id: pico_living_room_2
    alias: Living Room Pico 2 Handler
    triggers:
      - trigger: event
        event_type: lutron_caseta_button_event
        event_data:
          area_name: Living Room
          device_name: Living Room 2
          action: press
    action:
      - variables:
          button: "{{trigger.event.data.button_number}}"
          device: "{{trigger.event.data.device_name}}"
          buttons: { top: 2, middle: 3, bottom: 4, up: 5, down: 6 }
      - choose:
          - conditions: "{{button == buttons.bottom}}"
            sequence:
              - action: script.first_floor_low_lights_toggle
          - conditions: "{{button == buttons.up}}" # Up Arrow: open all living room blinds to 50%, open kitchen curtains
            sequence:
              - action: cover.set_cover_tilt_position
                target:
                  entity_id:
                    - cover.living_room_tv_left
                    - cover.living_room_fire_left
                    - cover.living_room_fire_right
                data:
                  tilt_position: 50
              - action: cover.open_cover
                target:
                  entity_id:
                    - cover.kitchen_curtain
          - conditions: "{{button == buttons.down}}" # Down Arrow: close all living room blinds, close kitchen curtains
            sequence:
              - action: cover.set_cover_tilt_position
                target:
                  entity_id:
                    - cover.living_room_tv_left
                    - cover.living_room_fire_left
                    - cover.living_room_fire_right
                data:
                  tilt_position: 0
              - action: cover.close_cover
                target:
                  entity_id:
                    - cover.kitchen_curtain

  - id: pico_master_bedroom
    alias: Master Bedroom Pico Handler
    triggers:
      - trigger: event
        event_type: lutron_caseta_button_event
        event_data:
          area_name: Master Bedroom
          device_name: Master Bedroom
          action: press
    action:
      - variables:
          button: "{{trigger.event.data.button_number}}"
          device: "{{trigger.event.data.device_name}}"
          buttons: { top: 2, middle: 3, bottom: 4, up: 5, down: 6 }
      - choose:
          - conditions: "{{button == buttons.bottom}}" # Bottom Button
            sequence:
              - action: switch.toggle
                data:
                  entity_id: switch.mbr_lamp

  - id: living_room_lights_scenes
    alias: Living Room Lights Scenes
    triggers:
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          command_class_name: Central Scene
          device_id: a5c1c236b6340ae8db83857c10e1bd8e
    action:
      - variables:
          direction: "{{'up' if trigger.event.data.property_key == '001' else 'down'}}"
          count: "{{trigger.event.data.value_raw - 1}}"

      - choose:
          - conditions: "{{direction == 'up' and count == 2}}"
            sequence:
              - action: script.first_floor_low_lights_on

          - conditions: "{{direction == 'up' and count == 3}}"
            sequence:
              - action: script.first_floor_all_on

          - conditions: "{{direction == 'down' and count == 2}}"
            sequence:
              - action: script.first_floor_all_off


