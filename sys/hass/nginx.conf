# Internal reverse proxy with self-signed TLS certs (no OCSP stapling)

events {}

http {
    client_body_temp_path /tmp/nginx/client_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr debug;

    # TLS config (Mozilla modern)
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name hass.iot zwave.iot;

        return 301 https://$host$request_uri;
    }

    # Home Assistant
    server {
        listen 443 ssl;
        server_name hass.iot;

        http2 on;
        ssl_certificate     /etc/nginx/ssl/hass.iot.crt;
        ssl_certificate_key /etc/nginx/ssl/hass.iot.key;

        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            proxy_pass http://127.0.0.1:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/websocket {
            proxy_pass http://127.0.0.1:8123;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Z-Wave JS
    server {
        listen 443 ssl;
        server_name zwave.iot;

        http2 on;
        ssl_certificate     /etc/nginx/ssl/zwave.iot.crt;
        ssl_certificate_key /etc/nginx/ssl/zwave.iot.key;

        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            proxy_pass http://127.0.0.1:8091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
