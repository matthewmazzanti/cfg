logger:
  default:  "info"

sun:
zeroconf:
dhcp:

automations:
  - id: turn_off_apple_tvs
    alias: Turn off Apple TVs
    trigger:
      - platform: time
        at: "01:00:00"
      - platform: time
        at: "02:00:00"
    action:
      - service: media_player.turn_off
        target:
          entity_id:
            - media_player.living_room
            - media_player.master_bedroom
