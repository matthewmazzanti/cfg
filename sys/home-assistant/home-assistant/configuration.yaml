logger:
  default:  "info"

sun:
zeroconf:
dhcp:
mobile_app:

http:
  server_host: 127.0.0.1

script:
  toggle_entities:
    alias: Toggle Entities
    description: Toggle a group of entities
    mode: queued
    fields:
      entity_id:
        description: List of entity IDs
        example: '["light.living_room", "switch.fan"]'
        required: true
        selector:
          entity:
            multiple: true
    sequence:
      - variables:
          any_on: "{{ 'on' in entity_id | map('states') }}"
      - service: "{{ 'homeassistant.turn_off' if any_on else 'homeassistant.turn_on' }}"
        target:
          entity_id: "{{ entity_id }}"

