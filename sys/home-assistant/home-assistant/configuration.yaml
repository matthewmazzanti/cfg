  - id: pico_living_room_1
    alias: Living Room Pico 1 Handler
    trigger:
      - platform: event
        event_type: lutron_caseta_button_event
        event_data:
          area_name: Living Room
          device_name: Living Room 1
          action: press
    action:
      - variables:
          button: "{{trigger.event.data.button_number}}"
          device: "{{trigger.event.data.device_name}}"
      - choose:
          - conditions: "{{button == 2}}" # Top Button
            sequence:
              - action: system_log.write
                data:
                  message: "Pico {{device}} Top Button Pressed!"
                  level: debug
          - conditions: "{{button == 4}}" # Bottom Button
            sequence:
              - action: switch.toggle
                data:
                  entity_id: switch.living_room_corner_lamp
          - conditions: "{{button == 5}}" # Up Arrow
            sequence:
              - action: system_log.write
                data:
                  message: "Pico {{device}} Up Arrow Pressed!"
                  level: debug
          - conditions: "{{button == 3}}" # Middle Button
            sequence:
              - action: system_log.write
                data:
                  message: "Pico {{device}} Middle Button Pressed!"
                  level: debug
          - conditions: "{{button == 6}}" # Bottom Arrow
            sequence:
              - action: system_log.write
                data:
                  message: "Pico {{device}} Bottom Arrow Pressed!"
                  level: debug

