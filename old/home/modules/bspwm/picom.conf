# Shadow
shadow = true;
shadow-radius = 25;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.7;
shadow-exclude = [
    "name = 'Notification'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Firefox' && window_type = 'utility'",
    "window_type = 'dnd'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
];

# Fading
fading = true;
fade-delta = 5;
fade-in-step = 0.04;
fade-out-step = 0.06;

# Other
backend = "glx";
mark-wmwin-focused = true;
mark-ovredir-focused = true;
# use-ewmh-active-win = true;
vsync = true;
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;

# GLX backend
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

blur: {
  method = "dual_kawase";
  strength = 12;
}

blur-background-exclude = [
    "class_g = 'slop'",
    "class_g = 'Firefox' && window_type = 'utility'",
    "window_type = 'dnd'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
];

unredir-if-possible-exclude = [
    "class_g = 'qutebrowser'",
];

opacity-rule = [
    "0:_NET_WM_STATE@:32a*='_NET_WM_STATE_HIDDEN'",
    "0:_PICOM_MONOCLE@:32c = 0",
];

frame-opacity = 0.85;

# Window type settings
wintypes: {
    tooltip = {
        fade = false;
        shadow = true;
        opacity = 0.75;
        focus = true;
        full-shadow = false;
    };

    dock = {
        shadow = false; 
    };

    dnd = {
        shadow = false;
        opacity = 1;
    };

    popup_menu = {};

    dropdown_menu = {};
};
